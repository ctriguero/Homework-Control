<!DOCTYPE html>
<html>
<head>

<style>
table {
    border-collapse: collapse;
}

th, td {
    border: 1px solid #333;
    width: 60px;
    height: 40px;
    text-align: center;
    cursor: pointer;
}

.name {
    width: 120px;
    font-weight: bold;
}

.rotate {
    height: 120px;
}

.rotate div {
    transform: rotate(-90deg);
    white-space: nowrap;
}

.checked {
    background: #92D050;
    color: white;
    font-size: 20px;
}
</style>

</head>

<body>

<h2>Homework Tracker</h2>

<table id="hwTable">

<tr>
    <th class="name">Student</th>
    <th class="rotate"><div>HW1</div></th>
    <th class="rotate"><div>HW2</div></th>
    <th class="rotate"><div>HW3</div></th>
</tr>

<tr>
    <td class="name">John</td>
    <td onclick="toggle(this)"></td>
    <td onclick="toggle(this)"></td>
    <td onclick="toggle(this)"></td>
</tr>

<tr>
    <td class="name">Mary</td>
    <td onclick="toggle(this)"></td>
    <td onclick="toggle(this)"></td>
    <td onclick="toggle(this)"></td>
</tr>

</table>

<br>

<button onclick="saveAsHTML()">💾 Save Today’s File</button>

<script>

// toggle tick
function toggle(cell){
    if(cell.classList.contains("checked")){
        cell.classList.remove("checked");
        cell.innerHTML = "";
    } else {
        cell.classList.add("checked");
        cell.innerHTML = "✔";
    }
}

// get today's date for filename
function getDateString(){
    let d = new Date();
    let y = d.getFullYear();
    let m = String(d.getMonth()+1).padStart(2,'0');
    let day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}

// SAVE FULL HTML FILE
function saveAsHTML(){

    let tableHTML = document.documentElement.outerHTML;

    let blob = new Blob([tableHTML], {type:"text/html"});

    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `homework-${getDateString()}.html`;

    a.click();
}

</script>

</body>
</html>
